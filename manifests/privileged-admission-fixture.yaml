apiVersion: v1
kind: Pod
metadata:
  name: demo-privileged-check
  namespace: demo-regulated
  labels:
    estrion-demo: approved
spec:
  hostNetwork: true
  hostPID: true
  containers:
    - name: nginx
      image: nginx:alpine
      securityContext:
        privileged: true
        runAsUser: 0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

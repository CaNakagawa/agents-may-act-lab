apiVersion: v1
kind: Pod
metadata:
  name: demo-nginx
  namespace: demo-unprotected
  labels:
    app.kubernetes.io/name: demo-nginx
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - name: http
          containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

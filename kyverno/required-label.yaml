apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: estrion-nginx-require-label
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: demo-regulated
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        'estrion-demo' in object.metadata.labels &&
        object.metadata.labels['estrion-demo'] == 'approved'
      message: "The regulated namespace requires the label estrion-demo=approved."
